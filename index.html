<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="ttt.js" defer></script>
</head>
<body>
    <div class="title">Tic Tac Toe</div>

    <div class="playLabel">Player One's Turn</div>

    <div class="square-container">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
    </div>

    <div class="score-container">
        <div class="score-box">
            <div class="score" id="p1">0</div>
            <div class="score-label">Player1</div>
        </div>

        <div class="score-box">
            <div class="score" id="p2">0</div>
            <div class="score-label">Player2</div>
        </div>
    </div>

    <div class="form-container">
        <form id="name-form">
            <input id="p1Name" type="text" placeholder="Player1 Name" required>
            <input id="p2Name" type="text" placeholder="Player2 Name" required>
        </form>
        
    </div>

    <div class="btn-container">
        <button id="start" class="btns" type="submit" form="name-form">Start</button>
        <button id="Rbtn" class="btns">Reset</button>
    </div>
    
</body>
</html>
